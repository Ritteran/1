# Sector Benchmark Configuration for NIFTY 50 Analysis
# These are ideal ranges for financial ratios by sector

Banking:
  description: "Banks and Financial Services"
  ratios:
    ROE:
      min: 12.0
      max: 18.0
      higher_is_better: true
      weight: 0.25
      description: "Return on Equity (%)"

    NIM:
      min: 2.5
      max: 4.0
      higher_is_better: true
      weight: 0.20
      description: "Net Interest Margin (%)"

    GNPA:
      min: 0.0
      max: 3.0
      higher_is_better: false
      weight: 0.25
      description: "Gross NPA Ratio (%)"

    PCR:
      min: 70.0
      max: 100.0
      higher_is_better: true
      weight: 0.15
      description: "Provision Coverage Ratio (%)"

    Cost_to_Income:
      min: 35.0
      max: 50.0
      higher_is_better: false
      weight: 0.15
      description: "Cost to Income Ratio (%)"

